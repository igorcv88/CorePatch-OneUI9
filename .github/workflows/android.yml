name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'gradle'

    - name: Write signing key
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > key.jks
          echo "releaseStorePassword=$KEYSTORE_PASSWORD" >> gradle.properties
          echo "releaseKeyAlias=$KEY_ALIAS" >> gradle.properties
          echo "releaseKeyPassword=$KEY_PASSWORD" >> gradle.properties
          echo "releaseStoreFile=key.jks" >> gradle.properties
        fi

    - name: Build with Gradle
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: outputs
        path: app/build/outputs/apk

    - name: Remove temporary signing key
      if: always()
      run: rm -f key.jks
