name: Gerar APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corepatch-oneui9-release
  cancel-in-progress: false

env:
  RELEASE_SERIES: "1.1"
  RELEASE_SUFFIX: "oneui9"

jobs:
  release:
    name: Gerar, assinar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confirmar branch main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Execute este workflow pela branch main." >&2
            exit 1
          fi

      - name: Escolher próxima versão
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          SERIES_PATTERN="${RELEASE_SERIES//./\.}"
          LAST_PATCH="$(
            git tag --list "v${RELEASE_SERIES}.*-${RELEASE_SUFFIX}" \
              | sed -nE "s/^v${SERIES_PATTERN}\.([0-9]+)-${RELEASE_SUFFIX}$/\1/p" \
              | sort -n \
              | tail -n 1
          )"

          if [[ -z "$LAST_PATCH" ]]; then
            PATCH=0
          else
            PATCH=$((LAST_PATCH + 1))
          fi

          VERSION_NAME="${RELEASE_SERIES}.${PATCH}-${RELEASE_SUFFIX}"
          VERSION_CODE=$((11000 + PATCH))
          RELEASE_TAG="v${VERSION_NAME}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "A tag ${RELEASE_TAG} já existe." >&2
            exit 1
          fi

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Reservar tag da release
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK Release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:assembleRelease \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -s "$UNSIGNED_APK" ]]; then
            echo "APK release não foi gerado em $UNSIGNED_APK" >&2
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.keystore
          chmod 600 release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Assinar e verificar APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          RELEASE_ASSET="CorePatch-OneUI9-${VERSION_NAME}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RELEASE_ASSET" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 4 "$RELEASE_ASSET"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_ASSET"

          BADGING="$($BUILD_TOOLS_DIR/aapt dump badging "$RELEASE_ASSET" | head -n 1)"
          grep -F "package: name='org.lsposed.corepatch'" <<< "$BADGING"
          grep -F "versionCode='${VERSION_CODE}'" <<< "$BADGING"
          grep -F "versionName='${VERSION_NAME}'" <<< "$BADGING"

          sha256sum "$RELEASE_ASSET" | tee "${RELEASE_ASSET}.sha256"
          echo "RELEASE_ASSET=$RELEASE_ASSET" >> "$GITHUB_ENV"

      - name: Publicar artifact do workflow
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-OneUI9-${{ env.VERSION_NAME }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_ASSET }}.sha256
          if-no-files-found: error

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' "${RELEASE_ASSET}.sha256")"

          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_PATH" <<EOF
          ## Core Patch N — One UI 9

          Compatibilidade endurecida para Samsung Android 17 / One UI 9, incluindo resolução fail-soft de APIs privadas e preservação do bypass de downgrade usado pelo One UI.

          - Package: \`org.lsposed.corepatch\`
          - Version: \`${VERSION_NAME}\`
          - Version code: \`${VERSION_CODE}\`
          - Commit: \`${GITHUB_SHA}\`
          - SHA-256: \`${SHA256}\`
          EOF

          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET" \
            "${RELEASE_ASSET}.sha256" \
            --verify-tag \
            --title "CorePatch One UI 9 ${VERSION_NAME}" \
            --notes-file "$NOTES_PATH" \
            --latest

      - name: Remover tag reservada se a publicação falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "Nenhuma tag de release foi reservada; nada para remover."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release já existe; preservando ${RELEASE_TAG}."
            exit 0
          fi
          git push origin ":refs/tags/${RELEASE_TAG}" || true

      - name: Apagar chave temporária
        if: always()
        run: rm -f release.keystore
